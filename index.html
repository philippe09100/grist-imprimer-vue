<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Imprimer la vue ++</title>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: white;
      color: #222;
    }

    .haut {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    button {
      padding: 8px 15px;
      cursor: pointer;
    }

    #compteur {
      margin-bottom: 12px;
      color: #666;
    }

    #message {
      padding: 15px;
      background: #f5f5f5;
      border: 1px solid #ccc;
    }

    .table-wrapper {
      width: 100%;
      max-height: 70vh;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      border: 1px solid #999;
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #eee;
      font-weight: bold;

      position: sticky;
      top: 0;
      z-index: 2;
    }

    tr {
      break-inside: avoid;
    }


    /* ------------------------------ */
    /* FENETRE DE CONFIGURATION TITRE */
    /* ------------------------------ */

    #configuration {
      display: none;

      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      width: 420px;
      max-width: calc(100% - 40px);

      background: white;
      border: 1px solid #999;
      padding: 20px;

      box-shadow: 0 4px 20px rgba(0,0,0,0.25);

      z-index: 1000;
    }

    #configuration h2 {
      margin-top: 0;
      font-size: 20px;
    }

    #configuration label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    #titreInput {
      box-sizing: border-box;
      width: 100%;

      padding: 8px;

      font-size: 15px;

      margin-bottom: 15px;
    }

    .boutonsConfiguration {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }


    /* ------------------------------ */
    /* IMPRESSION                     */
    /* ------------------------------ */

    @media print {

      body {
        margin: 0;
      }

      button {
        display: none;
      }

      #configuration {
        display: none !important;
      }

      .table-wrapper {
        max-height: none;
        overflow: visible;
      }

      table {
        font-size: 11px;
      }

      th {
        position: static;
      }

    }

  </style>
</head>


<body>


  <div class="haut">

    <h1 id="titreGeneral">
      Liste des participants
    </h1>

    <button onclick="window.print()">
      Imprimer
    </button>

  </div>


  <div id="compteur"></div>


  <div id="message">
    Choisissez les colonnes à imprimer dans les paramètres du widget.
  </div>


  <div class="table-wrapper">

    <table id="tableau" style="display:none;">

      <thead>
        <tr id="entetes"></tr>
      </thead>

      <tbody id="corps"></tbody>

    </table>

  </div>



  <!-- CONFIGURATION DU TITRE -->

  <div id="configuration">

    <h2>
      Configuration du tableau
    </h2>

    <label for="titreInput">
      Titre du tableau
    </label>

    <input
      id="titreInput"
      type="text"
      placeholder="Exemple : Liste des hospitaliers"
    >


    <div class="boutonsConfiguration">

      <button onclick="fermerConfiguration()">
        Annuler
      </button>

      <button onclick="enregistrerConfiguration()">
        Enregistrer
      </button>

    </div>

  </div>



  <script>

    /* ===================================== */
    /* VARIABLES                             */
    /* ===================================== */

    let labelsColonnes = {};

    let titreActuel = 'Liste des participants';



    /* ===================================== */
    /* CONFIGURATION DU TITRE                */
    /* ===================================== */

    function ouvrirConfiguration() {

      const configuration =
        document.getElementById('configuration');

      const titreInput =
        document.getElementById('titreInput');


      titreInput.value = titreActuel;

      configuration.style.display = 'block';

      titreInput.focus();

    }



    function fermerConfiguration() {

      document.getElementById(
        'configuration'
      ).style.display = 'none';

    }



    async function enregistrerConfiguration() {

      const titreInput =
        document.getElementById('titreInput');


      let nouveauTitre =
        titreInput.value.trim();


      if (!nouveauTitre) {

        nouveauTitre =
          'Liste des participants';

      }


      await grist.setOption(
        'titre',
        nouveauTitre
      );


      fermerConfiguration();

    }



    /* ===================================== */
    /* INITIALISATION GRIST                  */
    /* ===================================== */

    grist.ready({

      requiredAccess: 'full',

      columns: [

        {

          name: 'Colonnes',

          title: 'Colonnes à imprimer',

          type: 'Any',

          optional: true,

          allowMultiple: true

        }

      ],


      onEditOptions: function() {

        ouvrirConfiguration();

      }

    });



    /* ===================================== */
    /* OPTIONS DU WIDGET                     */
    /* ===================================== */

    grist.onOptions(function(options) {

      if (
        options &&
        options.titre
      ) {

        titreActuel =
          options.titre;

      } else {

        titreActuel =
          'Liste des participants';

      }


      document.getElementById(
        'titreGeneral'
      ).textContent =
        titreActuel;

    });



    /* ===================================== */
    /* LIBELLES DES COLONNES GRIST           */
    /* ===================================== */

    async function chargerLabelsColonnes() {

      try {

        const meta =
          await grist.docApi.fetchTable(
            '_grist_Tables_column'
          );


        labelsColonnes = {};


        for (
          let i = 0;
          i < meta.id.length;
          i++
        ) {

          const colId =
            meta.colId[i];

          const label =
            meta.label[i];


          if (colId) {

            labelsColonnes[colId] =
              label || colId;

          }

        }

      }

      catch (erreur) {

        console.error(
          'Impossible de récupérer les libellés :',
          erreur
        );

      }

    }



    /* ===================================== */
    /* RECEPTION DES DONNEES GRIST           */
    /* ===================================== */

    grist.onRecords(
      async function(records, mappings) {


        await chargerLabelsColonnes();


        const tableau =
          document.getElementById(
            'tableau'
          );

        const entetes =
          document.getElementById(
            'entetes'
          );

        const corps =
          document.getElementById(
            'corps'
          );

        const compteur =
          document.getElementById(
            'compteur'
          );

        const message =
          document.getElementById(
            'message'
          );


        entetes.innerHTML = '';

        corps.innerHTML = '';



        /* ------------------------------- */
        /* DONNEES                         */
        /* ------------------------------- */

        const donnees =
          records
            .map(
              record =>
                grist.mapColumnNames(
                  record
                )
            )
            .filter(Boolean);



        /* ------------------------------- */
        /* AUCUNE COLONNE SELECTIONNEE     */
        /* ------------------------------- */

        if (

          donnees.length === 0 ||

          !donnees[0].Colonnes ||

          !Array.isArray(
            donnees[0].Colonnes
          )

        ) {

          tableau.style.display =
            'none';

          message.style.display =
            'block';

          compteur.textContent =
            '';

          return;

        }



        message.style.display =
          'none';

        tableau.style.display =
          'table';



        /* ------------------------------- */
        /* COLONNES                        */
        /* ------------------------------- */

        const nombreColonnes =
          donnees[0].Colonnes.length;


        const colonnesMappees =

          mappings &&

          mappings.Colonnes &&

          Array.isArray(
            mappings.Colonnes
          )

            ? mappings.Colonnes

            : [];



        /* ------------------------------- */
        /* ENTETES                         */
        /* ------------------------------- */

        for (
          let i = 0;
          i < nombreColonnes;
          i++
        ) {

          const th =
            document.createElement(
              'th'
            );


          const colId =

            colonnesMappees[i] ||

            (
              'Colonne ' +
              (i + 1)
            );


          th.textContent =

            labelsColonnes[colId] ||

            colId;


          entetes.appendChild(
            th
          );

        }



        /* ------------------------------- */
        /* LIGNES DU TABLEAU               */
        /* ------------------------------- */

        donnees.forEach(
          ligne => {


            const tr =
              document.createElement(
                'tr'
              );


            ligne.Colonnes.forEach(
              valeur => {


                const td =
                  document.createElement(
                    'td'
                  );


                td.textContent =

                  valeur === null ||

                  valeur === undefined

                    ? ''

                    : valeur;


                tr.appendChild(
                  td
                );

              }
            );


            corps.appendChild(
              tr
            );

          }
        );



        /* ------------------------------- */
        /* COMPTEUR                        */
        /* ------------------------------- */

        compteur.textContent =

          donnees.length +

          ' ligne' +

          (
            donnees.length > 1
              ? 's'
              : ''
          );

      }
    );

  </script>

</body>
</html>
