<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Imprimer la vue ++</title>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: white;
      color: #222;
    }

    .haut {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 15px;
    }

    #titreGeneral {
      margin: 0;
      flex: 1;
    }

    .boutons-haut {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    button {
      padding: 8px 15px;
      cursor: pointer;
    }

    #compteur {
      margin-bottom: 12px;
      color: #666;
    }

    #message {
      padding: 15px;
      background: #f5f5f5;
      border: 1px solid #ccc;
    }

    .table-wrapper {
      width: 100%;
      max-height: 70vh;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      border: 1px solid #999;
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #eeeeee;
      color: #222222;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    tr {
      break-inside: avoid;
    }

    #fondConfiguration {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      z-index: 999;
    }

    #configuration {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: 480px;
      max-width: calc(100% - 60px);
      max-height: calc(100vh - 80px);

      overflow-y: auto;

      background: white;
      border: 1px solid #999;
      padding: 20px;

      box-shadow: 0 5px 25px rgba(0,0,0,0.25);

      z-index: 1000;
    }

    #configuration h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
    }

    #configuration h3 {
      margin-top: 22px;
      margin-bottom: 12px;
      padding-bottom: 5px;
      border-bottom: 1px solid #ddd;
      font-size: 16px;
    }

    .champ {
      margin-bottom: 15px;
    }

    .champ label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .champ input[type="text"],
    .champ input[type="number"],
    .champ select {
      box-sizing: border-box;
      width: 100%;
      padding: 8px;
      font-size: 14px;
    }

    .champ input[type="color"] {
      width: 70px;
      height: 36px;
      padding: 2px;
      cursor: pointer;
    }

    .ligne-options {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }

    .option-cocher {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .boutonsConfiguration {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    @media print {
      body {
        margin: 0;
      }

      .boutons-haut {
        display: none;
      }

      #configuration,
      #fondConfiguration {
        display: none !important;
      }

      .table-wrapper {
        max-height: none;
        overflow: visible;
      }

      table {
        font-size: 11px;
      }

      th {
        position: static;
      }
    }
  </style>
</head>

<body>

  <div class="haut">

    <h1 id="titreGeneral">
      Liste des participants
    </h1>

    <div class="boutons-haut">

      <button onclick="ouvrirConfiguration()">
        Présentation
      </button>

      <button onclick="window.print()">
        Imprimer
      </button>

    </div>

  </div>

  <div id="compteur"></div>

  <div id="message">
    Choisissez les colonnes à imprimer dans les paramètres du widget.
  </div>

  <div class="table-wrapper">

    <table id="tableau" style="display:none;">

      <thead>
        <tr id="entetes"></tr>
      </thead>

      <tbody id="corps"></tbody>

    </table>

  </div>

  <div
    id="fondConfiguration"
    onclick="fermerConfiguration()">
  </div>

  <div id="configuration">

    <h2>
      Présentation du tableau
    </h2>


    <h3>
      Titre général
    </h3>


    <div class="champ">

      <label for="titreInput">
        Titre du tableau
      </label>

      <input
        id="titreInput"
        type="text"
        placeholder="Exemple : Liste des hospitaliers"
      >

    </div>


    <div class="champ">

      <label for="policeTitre">
        Police
      </label>

      <select id="policeTitre">

        <option value="Arial, sans-serif">
          Arial
        </option>

        <option value="Verdana, sans-serif">
          Verdana
        </option>

        <option value="Tahoma, sans-serif">
          Tahoma
        </option>

        <option value="Trebuchet MS, sans-serif">
          Trebuchet MS
        </option>

        <option value="Georgia, serif">
          Georgia
        </option>

        <option value="Times New Roman, serif">
          Times New Roman
        </option>

      </select>

    </div>


    <div class="champ">

      <label for="tailleTitre">
        Taille du titre
      </label>

      <input
        id="tailleTitre"
        type="number"
        min="10"
        max="60"
        step="1"
      >

    </div>


    <div class="champ">

      <label>
        Style
      </label>

      <div class="ligne-options">

        <label class="option-cocher">

          <input
            id="grasTitre"
            type="checkbox"
          >

          Gras

        </label>


        <label class="option-cocher">

          <input
            id="italiqueTitre"
            type="checkbox"
          >

          Italique

        </label>

      </div>

    </div>


    <div class="champ">

      <label for="couleurTitre">
        Couleur du titre
      </label>

      <input
        id="couleurTitre"
        type="color"
      >

    </div>


    <div class="champ">

      <label for="alignementTitre">
        Alignement
      </label>

      <select id="alignementTitre">

        <option value="left">
          Gauche
        </option>

        <option value="center">
          Centre
        </option>

        <option value="right">
          Droite
        </option>

      </select>

    </div>



    <h3>
      En-têtes des colonnes
    </h3>


    <div class="champ">

      <label for="tailleEntetes">
        Taille de police
      </label>

      <input
        id="tailleEntetes"
        type="number"
        min="8"
        max="30"
        step="1"
      >

    </div>


    <div class="champ">

      <label class="option-cocher">

        <input
          id="couleurEntetesAuto"
          type="checkbox"
          onchange="actualiserEtatCouleurEntetes()"
        >

        Utiliser la couleur de texte définie dans Grist

      </label>

    </div>


    <div class="champ">

      <label for="couleurEntetes">
        Couleur du texte
      </label>

      <input
        id="couleurEntetes"
        type="color"
      >

    </div>


    <div class="boutonsConfiguration">

      <button onclick="fermerConfiguration()">
        Annuler
      </button>

      <button onclick="enregistrerConfiguration()">
        Enregistrer
      </button>

    </div>

  </div>


  <script>

    let labelsColonnes = {};
    let stylesColonnes = {};

    let derniersRecords = null;
    let derniersMappings = null;


    let optionsTitre = {

      titre:
        'Liste des participants',

      police:
        'Arial, sans-serif',

      taille:
        24,

      gras:
        true,

      italique:
        false,

      couleur:
        '#222222',

      alignement:
        'left'

    };


    let optionsEntetes = {

      taille:
        13,

      couleurAuto:
        true,

      couleur:
        '#222222'

    };



    function appliquerStyleTitre() {

      const titre =
        document.getElementById(
          'titreGeneral'
        );

      titre.textContent =
        optionsTitre.titre;

      titre.style.fontFamily =
        optionsTitre.police;

      titre.style.fontSize =
        optionsTitre.taille +
        'px';

      titre.style.fontWeight =
        optionsTitre.gras
          ? 'bold'
          : 'normal';

      titre.style.fontStyle =
        optionsTitre.italique
          ? 'italic'
          : 'normal';

      titre.style.color =
        optionsTitre.couleur;

      titre.style.textAlign =
        optionsTitre.alignement;

    }



    function ouvrirConfiguration() {

      document.getElementById(
        'titreInput'
      ).value =
        optionsTitre.titre;


      document.getElementById(
        'policeTitre'
      ).value =
        optionsTitre.police;


      document.getElementById(
        'tailleTitre'
      ).value =
        optionsTitre.taille;


      document.getElementById(
        'grasTitre'
      ).checked =
        optionsTitre.gras;


      document.getElementById(
        'italiqueTitre'
      ).checked =
        optionsTitre.italique;


      document.getElementById(
        'couleurTitre'
      ).value =
        optionsTitre.couleur;


      document.getElementById(
        'alignementTitre'
      ).value =
        optionsTitre.alignement;


      document.getElementById(
        'tailleEntetes'
      ).value =
        optionsEntetes.taille;


      document.getElementById(
        'couleurEntetesAuto'
      ).checked =
        optionsEntetes.couleurAuto;


      document.getElementById(
        'couleurEntetes'
      ).value =
        optionsEntetes.couleur;


      actualiserEtatCouleurEntetes();


      document.getElementById(
        'fondConfiguration'
      ).style.display =
        'block';


      document.getElementById(
        'configuration'
      ).style.display =
        'block';

    }



    function fermerConfiguration() {

      document.getElementById(
        'fondConfiguration'
      ).style.display =
        'none';


      document.getElementById(
        'configuration'
      ).style.display =
        'none';

    }



    function actualiserEtatCouleurEntetes() {

      const automatique =
        document.getElementById(
          'couleurEntetesAuto'
        ).checked;


      document.getElementById(
        'couleurEntetes'
      ).disabled =
        automatique;

    }



    async function enregistrerConfiguration() {

      const nouveauTitre =
        document.getElementById(
          'titreInput'
        ).value.trim();


      optionsTitre = {

        titre:
          nouveauTitre ||
          'Liste des participants',

        police:
          document.getElementById(
            'policeTitre'
          ).value,

        taille:
          Number(
            document.getElementById(
              'tailleTitre'
            ).value
          ) || 24,

        gras:
          document.getElementById(
            'grasTitre'
          ).checked,

        italique:
          document.getElementById(
            'italiqueTitre'
          ).checked,

        couleur:
          document.getElementById(
            'couleurTitre'
          ).value,

        alignement:
          document.getElementById(
            'alignementTitre'
          ).value

      };


      optionsEntetes = {

        taille:
          Number(
            document.getElementById(
              'tailleEntetes'
            ).value
          ) || 13,

        couleurAuto:
          document.getElementById(
            'couleurEntetesAuto'
          ).checked,

        couleur:
          document.getElementById(
            'couleurEntetes'
          ).value

      };


      appliquerStyleTitre();


      try {

        await grist.setOption(
          'titreOptions',
          optionsTitre
        );


        await grist.setOption(
          'enteteOptions',
          optionsEntetes
        );

      }

      catch (erreur) {

        console.error(
          'Impossible d’enregistrer les paramètres :',
          erreur
        );

      }


      fermerConfiguration();


      if (
        derniersRecords &&
        derniersMappings
      ) {

        afficherTableau(
          derniersRecords,
          derniersMappings
        );

      }

    }



    grist.ready({

      requiredAccess:
        'full',

      columns: [

        {

          name:
            'Colonnes',

          title:
            'Colonnes à imprimer',

          type:
            'Any',

          optional:
            true,

          allowMultiple:
            true

        }

      ]

    });



    grist.onOptions(
      function(options) {

        if (
          options &&
          options.titreOptions
        ) {

          optionsTitre = {
            ...optionsTitre,
            ...options.titreOptions
          };

        }


        if (
          options &&
          options.enteteOptions
        ) {

          optionsEntetes = {
            ...optionsEntetes,
            ...options.enteteOptions
          };

        }


        if (
          options &&
          options.titre &&
          !options.titreOptions
        ) {

          optionsTitre.titre =
            options.titre;

        }


        appliquerStyleTitre();

      }
    );



    function convertirOptions(texte) {

      if (!texte) {
        return {};
      }


      if (
        typeof texte ===
        'object'
      ) {

        return texte;

      }


      try {

        return JSON.parse(
          texte
        );

      }

      catch (erreur) {

        return {};

      }

    }



    function trouverCouleurFond(options) {

      return (

        options.fillColor ||

        options.backgroundColor ||

        options.bgColor ||

        options.cellBackgroundColor ||

        options.headerFillColor ||

        options.headerBackgroundColor ||

        null

      );

    }



    function trouverCouleurTexte(options) {

      return (

        options.textColor ||

        options.color ||

        options.fontColor ||

        options.headerTextColor ||

        null

      );

    }



    function creerStyleDepuisOptions(options) {

      return {

        fond:
          trouverCouleurFond(
            options
          ),

        texte:
          trouverCouleurTexte(
            options
          )

      };

    }



    async function chargerMetadonnees(
      colonnesMappees
    ) {

      try {

        const tables =
          await grist.docApi.fetchTable(
            '_grist_Tables'
          );


        const colonnes =
          await grist.docApi.fetchTable(
            '_grist_Tables_column'
          );


        const champsVue =
          await grist.docApi.fetchTable(
            '_grist_Views_section_field'
          );


        labelsColonnes = {};
        stylesColonnes = {};


        let tableRefSource =
          null;


        for (
          let i = 0;
          i < colonnes.id.length;
          i++
        ) {

          const colId =
            colonnes.colId[i];


          labelsColonnes[
            colId
          ] =
            colonnes.label[i] ||
            colId;


          if (
            tableRefSource === null &&
            colonnesMappees.includes(
              colId
            )
          ) {

            tableRefSource =
              colonnes.parentId[i];

          }

        }



        if (
          tableRefSource ===
          null
        ) {

          return;

        }



        let sectionSource =
          null;


        for (
          let i = 0;
          i < tables.id.length;
          i++
        ) {

          if (
            tables.id[i] ===
            tableRefSource
          ) {

            sectionSource =
              tables.rawViewSectionRef[i];

            break;

          }

        }



        for (
          let i = 0;
          i < colonnes.id.length;
          i++
        ) {

          if (
            colonnes.parentId[i] !==
            tableRefSource
          ) {

            continue;

          }


          const colId =
            colonnes.colId[i];


          const options =
            convertirOptions(
              colonnes.widgetOptions[i]
            );


          stylesColonnes[
            colId
          ] =
            creerStyleDepuisOptions(
              options
            );

        }



        if (sectionSource) {

          const colIdParRef =
            {};


          for (
            let i = 0;
            i < colonnes.id.length;
            i++
          ) {

            if (
              colonnes.parentId[i] ===
              tableRefSource
            ) {

              colIdParRef[
                colonnes.id[i]
              ] =
                colonnes.colId[i];

            }

          }



          for (
            let i = 0;
            i < champsVue.id.length;
            i++
          ) {

            if (
              champsVue.parentId[i] !==
              sectionSource
            ) {

              continue;

            }


            const colId =
              colIdParRef[
                champsVue.colRef[i]
              ];


            if (!colId) {
              continue;
            }


            const optionsVue =
              convertirOptions(
                champsVue.widgetOptions[i]
              );


            const styleVue =
              creerStyleDepuisOptions(
                optionsVue
              );


            if (
              !stylesColonnes[
                colId
              ]
            ) {

              stylesColonnes[
                colId
              ] = {};

            }


            if (
              styleVue.fond
            ) {

              stylesColonnes[
                colId
              ].fond =
                styleVue.fond;

            }


            if (
              styleVue.texte
            ) {

              stylesColonnes[
                colId
              ].texte =
                styleVue.texte;

            }

          }

        }

      }

      catch (erreur) {

        console.error(
          'Impossible de récupérer les styles Grist :',
          erreur
        );

      }

    }



    async function afficherTableau(
      records,
      mappings
    ) {

      const colonnesMappees =

        mappings &&

        mappings.Colonnes &&

        Array.isArray(
          mappings.Colonnes
        )

          ? mappings.Colonnes

          : [];


      await chargerMetadonnees(
        colonnesMappees
      );


      const tableau =
        document.getElementById(
          'tableau'
        );


      const entetes =
        document.getElementById(
          'entetes'
        );


      const corps =
        document.getElementById(
          'corps'
        );


      const compteur =
        document.getElementById(
          'compteur'
        );


      const message =
        document.getElementById(
          'message'
        );


      entetes.innerHTML =
        '';


      corps.innerHTML =
        '';


      const donnees =

        records
          .map(
            record =>
              grist.mapColumnNames(
                record
              )
          )
          .filter(
            Boolean
          );


      if (

        donnees.length === 0 ||

        !donnees[0].Colonnes ||

        !Array.isArray(
          donnees[0].Colonnes
        )

      ) {

        tableau.style.display =
          'none';


        message.style.display =
          'block';


        compteur.textContent =
          '';


        return;

      }


      message.style.display =
        'none';


      tableau.style.display =
        'table';


      const nombreColonnes =
        donnees[0].Colonnes.length;



      for (
        let i = 0;
        i < nombreColonnes;
        i++
      ) {

        const th =
          document.createElement(
            'th'
          );


        const colId =

          colonnesMappees[i] ||

          (
            'Colonne ' +
            (i + 1)
          );


        th.textContent =

          labelsColonnes[
            colId
          ] ||

          colId;


        th.style.backgroundColor =
          '#eeeeee';


        th.style.color =
          '#222222';


        th.style.fontSize =
          optionsEntetes.taille +
          'px';


        const style =
          stylesColonnes[
            colId
          ] ||
          {};


        if (
          style.fond
        ) {

          th.style.backgroundColor =
            style.fond;

        }


        if (
          optionsEntetes.couleurAuto
        ) {

          if (
            style.texte
          ) {

            th.style.color =
              style.texte;

          }

        }

        else {

          th.style.color =
            optionsEntetes.couleur;

        }


        entetes.appendChild(
          th
        );

      }



      donnees.forEach(
        ligne => {


          const tr =
            document.createElement(
              'tr'
            );


          ligne.Colonnes.forEach(
            valeur => {


              const td =
                document.createElement(
                  'td'
                );


              td.textContent =

                valeur === null ||

                valeur === undefined

                  ? ''

                  : valeur;


              tr.appendChild(
                td
              );

            }
          );


          corps.appendChild(
            tr
          );

        }
      );


      compteur.textContent =

        donnees.length +

        ' ligne' +

        (
          donnees.length > 1
            ? 's'
            : ''
        );

    }



    grist.onRecords(
      async function(
        records,
        mappings
      ) {

        derniersRecords =
          records;


        derniersMappings =
          mappings;


        await afficherTableau(
          records,
          mappings
        );

      }
    );



    appliquerStyleTitre();

  </script>

</body>
</html>
