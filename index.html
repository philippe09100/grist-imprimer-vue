<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Imprimer la vue ++</title>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: white;
      color: #222;
    }

    .haut {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 15px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .boutons-haut {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    button {
      padding: 8px 15px;
      cursor: pointer;
    }

    #compteur {
      margin-bottom: 12px;
      color: #666;
    }

    #message {
      padding: 15px;
      background: #f5f5f5;
      border: 1px solid #ccc;
    }

    .table-wrapper {
      width: 100%;
      max-height: 70vh;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      border: 1px solid #999;
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #eee;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    tr {
      break-inside: avoid;
    }


    /* FOND DE LA FENÊTRE */

    #fondConfiguration {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      z-index: 999;
    }


    /* FENÊTRE DE CONFIGURATION */

    #configuration {
      display: none;

      position: fixed;
      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 420px;
      max-width: calc(100% - 60px);

      background: white;
      border: 1px solid #999;

      padding: 20px;

      box-shadow: 0 5px 25px rgba(0,0,0,0.25);

      z-index: 1000;
    }

    #configuration h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
    }

    #configuration label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    #titreInput {
      box-sizing: border-box;
      width: 100%;

      padding: 9px;

      font-size: 15px;

      margin-bottom: 20px;
    }

    .boutonsConfiguration {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }


    /* IMPRESSION */

    @media print {

      body {
        margin: 0;
      }

      .boutons-haut {
        display: none;
      }

      #configuration,
      #fondConfiguration {
        display: none !important;
      }

      .table-wrapper {
        max-height: none;
        overflow: visible;
      }

      table {
        font-size: 11px;
      }

      th {
        position: static;
      }

    }

  </style>
</head>

<body>


  <div class="haut">

    <h1 id="titreGeneral">
      Liste des participants
    </h1>


    <div class="boutons-haut">

      <button onclick="ouvrirConfiguration()">
        Titre
      </button>

      <button onclick="window.print()">
        Imprimer
      </button>

    </div>

  </div>


  <div id="compteur"></div>


  <div id="message">
    Choisissez les colonnes à imprimer dans les paramètres du widget.
  </div>


  <div class="table-wrapper">

    <table id="tableau" style="display:none;">

      <thead>
        <tr id="entetes"></tr>
      </thead>

      <tbody id="corps"></tbody>

    </table>

  </div>



  <div
    id="fondConfiguration"
    onclick="fermerConfiguration()">
  </div>



  <div id="configuration">

    <h2>
      Modifier le titre
    </h2>

    <label for="titreInput">
      Titre du tableau
    </label>

    <input
      id="titreInput"
      type="text"
      placeholder="Exemple : Liste des hospitaliers"
    >


    <div class="boutonsConfiguration">

      <button onclick="fermerConfiguration()">
        Annuler
      </button>

      <button onclick="enregistrerConfiguration()">
        Enregistrer
      </button>

    </div>

  </div>



  <script>

    let labelsColonnes = {};

    let titreActuel =
      'Liste des participants';



    /* ============================= */
    /* CONFIGURATION DU TITRE        */
    /* ============================= */

    function ouvrirConfiguration() {

      const titreInput =
        document.getElementById('titreInput');

      titreInput.value =
        titreActuel;


      document.getElementById(
        'fondConfiguration'
      ).style.display =
        'block';


      document.getElementById(
        'configuration'
      ).style.display =
        'block';


      titreInput.focus();

      titreInput.select();

    }



    function fermerConfiguration() {

      document.getElementById(
        'fondConfiguration'
      ).style.display =
        'none';


      document.getElementById(
        'configuration'
      ).style.display =
        'none';

    }



    async function enregistrerConfiguration() {

      const titreInput =
        document.getElementById(
          'titreInput'
        );


      let nouveauTitre =
        titreInput.value.trim();


      if (!nouveauTitre) {

        nouveauTitre =
          'Liste des participants';

      }


      titreActuel =
        nouveauTitre;


      document.getElementById(
        'titreGeneral'
      ).textContent =
        titreActuel;


      try {

        await grist.setOption(
          'titre',
          titreActuel
        );

      }

      catch (erreur) {

        console.error(
          'Impossible d’enregistrer le titre :',
          erreur
        );

      }


      fermerConfiguration();

    }



    /* ENTRÉE = ENREGISTRER */

    document.getElementById(
      'titreInput'
    ).addEventListener(
      'keydown',
      function(event) {

        if (event.key === 'Enter') {

          enregistrerConfiguration();

        }

        if (event.key === 'Escape') {

          fermerConfiguration();

        }

      }
    );



    /* ============================= */
    /* INITIALISATION GRIST          */
    /* ============================= */

    grist.ready({

      requiredAccess: 'full',

      columns: [

        {

          name: 'Colonnes',

          title: 'Colonnes à imprimer',

          type: 'Any',

          optional: true,

          allowMultiple: true

        }

      ]

    });



    /* ============================= */
    /* OPTIONS ENREGISTRÉES          */
    /* ============================= */

    grist.onOptions(
      function(options) {

        if (
          options &&
          options.titre
        ) {

          titreActuel =
            options.titre;

        }

        else {

          titreActuel =
            'Liste des participants';

        }


        document.getElementById(
          'titreGeneral'
        ).textContent =
          titreActuel;

      }
    );



    /* ============================= */
    /* NOMS VISIBLES DES COLONNES    */
    /* ============================= */

    async function chargerLabelsColonnes() {

      try {

        const meta =
          await grist.docApi.fetchTable(
            '_grist_Tables_column'
          );


        labelsColonnes = {};


        for (
          let i = 0;
          i < meta.id.length;
          i++
        ) {

          const colId =
            meta.colId[i];

          const label =
            meta.label[i];


          if (colId) {

            labelsColonnes[colId] =
              label || colId;

          }

        }

      }

      catch (erreur) {

        console.error(
          'Impossible de récupérer les libellés :',
          erreur
        );

      }

    }



    /* ============================= */
    /* DONNÉES GRIST                 */
    /* ============================= */

    grist.onRecords(
      async function(records, mappings) {


        await chargerLabelsColonnes();


        const tableau =
          document.getElementById(
            'tableau'
          );

        const entetes =
          document.getElementById(
            'entetes'
          );

        const corps =
          document.getElementById(
            'corps'
          );

        const compteur =
          document.getElementById(
            'compteur'
          );

        const message =
          document.getElementById(
            'message'
          );


        entetes.innerHTML = '';

        corps.innerHTML = '';



        const donnees =
          records
            .map(
              record =>
                grist.mapColumnNames(
                  record
                )
            )
            .filter(Boolean);



        if (

          donnees.length === 0 ||

          !donnees[0].Colonnes ||

          !Array.isArray(
            donnees[0].Colonnes
          )

        ) {

          tableau.style.display =
            'none';

          message.style.display =
            'block';

          compteur.textContent =
            '';

          return;

        }



        message.style.display =
          'none';

        tableau.style.display =
          'table';



        const nombreColonnes =
          donnees[0].Colonnes.length;


        const colonnesMappees =

          mappings &&

          mappings.Colonnes &&

          Array.isArray(
            mappings.Colonnes
          )

            ? mappings.Colonnes

            : [];



        /* ENTÊTES */

        for (
          let i = 0;
          i < nombreColonnes;
          i++
        ) {

          const th =
            document.createElement(
              'th'
            );


          const colId =

            colonnesMappees[i] ||

            (
              'Colonne ' +
              (i + 1)
            );


          th.textContent =

            labelsColonnes[colId] ||

            colId;


          entetes.appendChild(
            th
          );

        }



        /* LIGNES */

        donnees.forEach(
          ligne => {


            const tr =
              document.createElement(
                'tr'
              );


            ligne.Colonnes.forEach(
              valeur => {


                const td =
                  document.createElement(
                    'td'
                  );


                td.textContent =

                  valeur === null ||

                  valeur === undefined

                    ? ''

                    : valeur;


                tr.appendChild(
                  td
                );

              }
            );


            corps.appendChild(
              tr
            );

          }
        );



        /* COMPTEUR */

        compteur.textContent =

          donnees.length +

          ' ligne' +

          (
            donnees.length > 1
              ? 's'
              : ''
          );

      }
    );

  </script>

</body>
</html>
